[package]
name = "gen-reference"
version = "0.3.0"
edition = "2021"
publish = false

[dependencies]
proj = "0.31"
proj-epsg-format = { path = "../proj-epsg-format" }
proj-sys = "0.27"
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Keep the embedded registry reproducible from PROJ 9.6.2. Coordinate
# reference generation uses --no-default-features with PROJ 9.8 or newer.
default = ["bundled-proj"]
bundled-proj = ["proj/bundled_proj", "proj-sys/bundled_proj"]

[[bin]]
name = "gen-reference"
path = "src/main.rs"

[[bin]]
name = "gen-registry"
path = "src/gen_registry.rs"

[[bin]]
name = "inspect-schema"
path = "src/inspect_schema.rs"

[[bin]]
name = "gen-selection-parity"
path = "src/gen_selection_parity.rs"
